     WHY TWO COPIES AND NOT ONE
     --------------------------
     The first is the automatic redirect; the second is the visible link a
     visitor clicks if the automatic one does not fire. The fallback link
     must carry the full literal URL, because the situations where it is
     needed are exactly the situations where nothing is running to fill it
     in. An earlier version generated that href with JavaScript, which left
     it empty for anyone without JavaScript -- the one audience it existed
     to serve. Both URLs are now written out in full, one after the other.

     TO CHANGE THE DESTINATION (e.g. when our own storefront/cart goes live):
     The two URLs below are now deliberately DIFFERENT. The automatic
     redirect goes to the modus-go Worker, which logs the click and forwards
     on; the visible fallback stays a direct link, so a visitor whose
     automatic redirect never fires still lands in the right place without
     depending on the same hop. Those fallback clicks go uncounted -- the
     known and accepted cost of keeping the lifeboat independent.

       1. Change the slug's entry in worker/src/index.js and redeploy:
            cd worker && npx wrangler deploy
       2. Change ONLY the fallback link below to the same new URL. The meta
          refresh points at the Worker route and never needs editing again.
       3. Run  python3 check_redirect.py --live  to confirm the two agree.
       4. Commit. GitHub Pages republishes in roughly a minute.

     CURRENT DESTINATION (as of 16 September 2026)
     ---------------------------------------------
     An Amazon two-step search: a real, unmodified Amazon search results
     page for "kakuro puzzle book", narrowed by the author filter (rh=p_27)
     to Modus Racio, which isolates it to our single title, ASIN
     B0HJZ2LKF8. Verified 16 Sep 2026: returns "1 result". This is a genuine
     filtered search page, not a single-hop product link dressed up with
     keyword parameters.

     If it ever stops resolving to exactly one result, the cause is almost
     always the author name changing in KDP -- update the p_27 value to the
     author name exactly as Amazon shows it, or fall back to the plain
     product page https://www.amazon.com/dp/B0HJZ2LKF8
-->
