<title>Kakuro 2-in-1 Puzzle Book — Modus Entertainment</title>

<!-- =====================================================================
     THE ONLY LINE YOU EVER EDIT IS THE <meta http-equiv="refresh"> BELOW.
     =====================================================================

     This page is a permanent, owned redirect. Its public address is:

         https://modusentertainment.github.io/go/kakuro/

     That address is the ONLY link that goes in bios, captions, pins and
     posts. Never link a retailer URL directly. Every post that ever used
     this link -- past and future -- follows whatever this one page points
     at, so changing the destination here re-points all historical traffic
     at once, with nothing to edit on any social platform.

     TO CHANGE THE DESTINATION (e.g. when our own storefront/cart goes live):
       1. Edit the url= value inside the meta refresh tag below. Nothing else.
       2. Commit. GitHub Pages republishes in roughly a minute.

     Do not add a second copy of the URL anywhere in this file. The script
     at the bottom reads the destination back out of that same meta tag, so
     there is exactly one source of truth and the two can never disagree.

     CURRENT DESTINATION (as of 16 September 2026)
     ---------------------------------------------
     An Amazon two-step search: a real, unmodified Amazon search results
     page for "kakuro puzzle book", narrowed by the author filter
     (rh=p_27) to Modus Racio, which isolates it to our single title,
     ASIN B0HJZ2LKF8. Verified 16 Sep 2026: returns "1 result". This is a
     genuine filtered search page, not a single-hop product link dressed up
     with keyword parameters.

     If the destination ever stops resolving to exactly one result, the
     cause is almost always the author name changing in KDP -- update the
     p_27 value to match the author name exactly as Amazon shows it, or
     fall back to the plain product page https://www.amazon.com/dp/B0HJZ2LKF8
-->
<meta http-equiv="refresh" content="0; url=https://www.amazon.com/s?k=kakuro+puzzle+book&i=stripbooks&rh=p_27%3AModus%2BRacio">

<style>
body{max-width:42rem;margin:0 auto;padding:4rem 1.25rem;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#1a1a1a;background:#fff;text-align:center}
a{color:#0057b8}
@media (prefers-color-scheme:dark){body{background:#151515;color:#e8e8e8}a{color:#79b8ff}}
</style>
</head>
<body>
<p>Taking you to the Kakuro 2-in-1 Puzzle Book&hellip;</p>
<p><a id="manual" href="">Continue here</a> if you are not redirected.</p>

<script>
// Single source of truth: read the destination back out of the meta refresh
// tag above so this file never holds two copies of the URL. location.replace
// keeps this page out of browser history, so Back returns to the social app
// rather than bouncing the visitor through the redirect again.
var dest = document.querySelector('meta[http-equiv="refresh"]').content.split(/url=/i)[1];
document.getElementById('manual').href = dest;
location.replace(dest);
</script>
</body>
</html>
