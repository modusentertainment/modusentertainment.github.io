<title>Facebook — Modus Entertainment</title>

<!-- =====================================================================
     TO CHANGE WHERE THIS LINK GOES, EDIT worker/src/index.js -- NOT THIS FILE.
     That Worker's DESTINATIONS map is the single source of truth.
     =====================================================================

     This page is a permanent, owned redirect. Its public address is:

         https://modusentertainment.github.io/go/facebook/

     That address is what goes in Linktree, bios, captions and posts --
     never the raw Facebook URL. If we ever move, rename or lose the
     Facebook profile, every link ever posted follows this page instead of
     breaking, and nothing has to be edited on any social platform.

     The destination appears twice on purpose: once as the automatic
     redirect, once as the visible fallback link a visitor clicks if the
     automatic one does not fire. The fallback href is written out in full
     rather than generated at runtime, because the cases where it is needed
     are exactly the cases where no script is running to fill it in.

     TO CHANGE THE DESTINATION:
     The two URLs below are now deliberately DIFFERENT. The automatic
     redirect goes to the modus-go Worker, which logs the click and forwards
     on; the visible fallback stays a direct link, so a visitor whose
     automatic redirect never fires still lands in the right place without
     depending on the same hop. Those fallback clicks go uncounted -- the
     known and accepted cost of keeping the lifeboat independent.

       1. Change the slug's entry in worker/src/index.js and redeploy:
            cd worker && npx wrangler deploy
       2. Change ONLY the fallback link below to the same new URL. The meta
          refresh points at the Worker route and never needs editing again.
       3. Run  python3 check_redirect.py --live  to confirm the two agree.
       4. Run  python3 publish_site.py go/facebook/index.html  to publish.

     CURRENT DESTINATION (as of 21 September 2026)
     ---------------------------------------------
     The Modus Entertainment Facebook Page, id 1368991559620257 (the Page has no
     vanity username yet; if one is set later, swap both URLs for
     https://www.facebook.com/<username>). Verified 21 Sep 2026.
-->

<!-- THE TRACKED HOP -- the automatic redirect. Goes to the modus-go Worker,
     which records the click and then forwards to the real destination.
     Fires without JavaScript. -->
<meta http-equiv="refresh" content="0; url=https://modus-go.modusentertainment.workers.dev/facebook">

<!-- THE DIRECT FALLBACK -- deliberately NOT the Worker route, so it still
     works if the Worker ever does not. Must match the destination the Worker

     Written out in full on purpose: nothing computes this href at runtime, so
     it still works with JavaScript disabled or blocked. -->
<p><a href="https://www.facebook.com/1368991559620257">Continue to Facebook</a> if you are not redirected automatically.</p>
</body>
