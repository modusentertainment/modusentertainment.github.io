<!-- =====================================================================
     TO CHANGE WHERE THIS LINK GOES, EDIT THE TWO URLs IN THE BLOCK BELOW.
     They are deliberately kept side by side, and they MUST be identical.
     =====================================================================

     This page is a permanent, owned redirect. Its public address is:

         https://modusentertainment.github.io/go/kakuro-review/

     *** THIS URL IS PRINTED AS A QR CODE INSIDE THE PHYSICAL BOOK. ***

     That makes this file unusually load-bearing. Printed copies cannot be
     recalled or corrected, so the QR code in every book ever sold points
     here forever. Whatever this page redirects to is where those scans
     land. Treat the page's ADDRESS as immutable -- never rename this
     directory, never delete this file, never move it -- while the
     DESTINATION below stays freely editable.

     If this repo is ever migrated, retired, or moved to a custom domain,
     this path must be preserved or forwarded, or every printed book loses
     its review link permanently.

     WHY TWO COPIES AND NOT ONE
     --------------------------
     The first is the automatic redirect; the second is the visible link a
     visitor clicks if the automatic one does not fire. The fallback link
     must carry the full literal URL, because the situations where it is
     needed are exactly the situations where nothing is running to fill it
     in. Both URLs are written out in full, one after the other.

     TO CHANGE THE DESTINATION (e.g. when our own storefront/cart goes live):
       1. Replace the URL in BOTH lines of the block below with the new one.
       2. Run  python3 check_redirect.py  to confirm the two still match.
       3. Commit. GitHub Pages republishes in roughly a minute.

     CURRENT DESTINATION (as of 16 September 2026)
     ---------------------------------------------
     Amazon's "write a customer review" form for ASIN B0HJZ2LKF8 (Kakuro
     2-in-1 Puzzle Book, Beginner Volume). Amazon requires the reader to be
     signed in and to have a qualifying purchase; if they are not signed
     in, Amazon shows its own sign-in page first and then returns them to
     the review form. That is Amazon's flow, not something this page
     controls.
-->

<!-- DESTINATION 1 of 2 -- the automatic redirect. Fires without JavaScript. -->
<meta http-equiv="refresh" content="0; url=https://www.amazon.com/review/create-review?asin=B0HJZ2LKF8">

</style>
</head>

<p>Taking you to the review page&hellip; thank you!</p>

<!-- DESTINATION 2 of 2 -- the fallback link. Must match DESTINATION 1 exactly.
     Written out in full on purpose: nothing computes this href at runtime, so
     it still works with JavaScript disabled or blocked. -->
<p><a href="https://www.amazon.com/review/create-review?asin=B0HJZ2LKF8">Continue to the review page</a> if you are not redirected automatically.</p>
</body>
